project_id = "centro-terapias"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[analytics]
# Recolector técnico opcional: incompatible con resolución IPv6 de Docker Desktop local.
# La auditoría de la aplicación se conserva en PostgreSQL.
enabled = false
[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
[auth.email]
enable_confirmations = true
[functions.invite-user]
# La función verifica el bearer con auth.getUser y permiso en la base.
# Compatible con claves publishable que no son JWT del gateway.
verify_jwt = false
